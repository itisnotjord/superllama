[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superllama"
version = "0.1.0"
description = "Run Qwen 3.5 locally at raw llama.cpp speed. Faster than Ollama."
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["llama.cpp", "qwen", "llm", "local", "inference", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
superllama = "superllama.cli:main"

[project.urls]
Homepage = "https://github.com/superllama/superllama"
